services:
  knowledge-postgres:
    build:
      context: .
      dockerfile: docker/knowledge-postgres/Dockerfile
    image: workflows-knowledge-postgres:16-postgis-pgvector
    environment:
      POSTGRES_DB: workflows
      POSTGRES_USER: workflows
      POSTGRES_PASSWORD: workflows
    ports:
      - "${KNOWLEDGE_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflows -d workflows"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - workflows-knowledge-postgres:/var/lib/postgresql/data

volumes:
  workflows-knowledge-postgres:
