services:
  knowledge-postgres:
    build:
      context: .
      dockerfile: docker/knowledge-postgres/Dockerfile
    image: workflows-knowledge-postgres:16-postgis-pgvector
    environment:
      POSTGRES_DB: workflows
      POSTGRES_USER: workflows
      POSTGRES_PASSWORD: workflows
    ports:
      - "${KNOWLEDGE_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflows -d workflows"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - workflows-knowledge-postgres:/var/lib/postgresql/data

  knowledge-neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "${KNOWLEDGE_NEO4J_USER:-neo4j}/${KNOWLEDGE_NEO4J_PASSWORD:-workflows-knowledge}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${KNOWLEDGE_NEO4J_HTTP_PORT:-57474}:7474"
      - "${KNOWLEDGE_NEO4J_BOLT_PORT:-57687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - workflows-knowledge-neo4j:/data

volumes:
  workflows-knowledge-postgres:
  workflows-knowledge-neo4j:
