<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orchestrator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <strong>Orchestrator</strong>
          <span class="muted">M6 web shell</span>
        </div>
        <div class="status" id="health">connecting…</div>
      </header>

      <aside class="sidebar">
        <label>
          Session
          <input id="sessionId" type="text" value="ui-default" autocomplete="off" />
        </label>
        <label>
          Workspace
          <input
            id="workspace"
            type="text"
            placeholder="absolute path (tools)"
            autocomplete="off"
          />
        </label>
        <label class="check">
          <input id="toolsEnabled" type="checkbox" />
          Tools enabled
        </label>
        <div class="meta" id="meta">
          <div class="meta-empty">Send a message to see route / model / latency.</div>
        </div>
      </aside>

      <main class="main">
        <div id="log" class="log" aria-live="polite"></div>
        <form id="form" class="composer">
          <textarea
            id="prompt"
            rows="3"
            placeholder="Message… (Enter to send, Shift+Enter newline)"
            required
          ></textarea>
          <button type="submit" id="send">Send</button>
        </form>
        <p class="hint muted">
          UI is a shell over <code>POST /v1/chat</code>. CLI remains for scripts/CI.
          No personal data is written to public paths by this page.
        </p>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
